name: Build & Release NOVA IPTV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: set -o pipefail; ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a build.log

      - name: Build debug APK
        run: set -o pipefail; ./gradlew --no-daemon assembleDebug 2>&1 | tee -a build.log

      - name: Decode signing key (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build optimised release APK
        env:
          NOVA_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: set -o pipefail; ./gradlew --no-daemon assembleRelease 2>&1 | tee -a build.log

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NOVA-IPTV-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/NOVA-IPTV.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/NOVA-IPTV.apk
          fi
          (cd tizen && zip -qr ../dist/NOVA-IPTV-Tizen.zip . -x '*.wgt')
          # Ready-to-install widget for Samsung TVs (Apps2Samsung signs it with your own certificate).
          (cd tizen && zip -qr -X ../dist/NOVA-IPTV.wgt config.xml index.html icon.png css js)
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-IPTV-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NOVA IPTV 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Android (always the latest build):
            https://github.com/${{ github.repository }}/releases/latest/download/NOVA-IPTV.apk

            Samsung TV — install from your phone with Apps2Samsung (see tizen/README.md):
            https://github.com/${{ github.repository }}/releases/latest/download/NOVA-IPTV.wgt

            Samsung TV source project (Tizen Studio):
            https://github.com/${{ github.repository }}/releases/latest/download/NOVA-IPTV-Tizen.zip
          files: |
            dist/NOVA-IPTV.apk
            dist/NOVA-IPTV-debug.apk
            dist/NOVA-IPTV-Tizen.zip
            dist/NOVA-IPTV.wgt

      - name: Report build errors on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERR=$(grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log 2>/dev/null | head -60 || true)
          [ -z "$ERR" ] && ERR="Build failed (no compiler output captured)."
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="Build failed:
          \`\`\`
          $ERR
          \`\`\`"
