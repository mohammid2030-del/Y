<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA trailer</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{position:absolute;top:0;left:0;width:100%;height:100%}</style>
</head><body><div id="p"></div>
<script>
// Official YouTube embedded player for NOVA IPTV (the TV app opens this page so YouTube sees a real web origin).
// It tells the app when the video plays, ends or can't be embedded, so the app can fall back to the YouTube app.
(function () {
  var q = {}; location.search.slice(1).split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) q[p[0]] = decodeURIComponent(p[1] || ''); });
  var id = String(q.v || '').replace(/[^A-Za-z0-9_-]/g, '');
  function tell(type, extra) { try { parent.postMessage(JSON.stringify({ nova: 'trailer', type: type, extra: extra || null }), '*'); } catch (e) {} }
  if (!id) { tell('error', 'no-id'); return; }
  window.onYouTubeIframeAPIReady = function () {
    new YT.Player('p', {
      videoId: id, width: '100%', height: '100%',
      playerVars: { autoplay: 1, controls: 1, rel: 0, modestbranding: 1, playsinline: 1, hl: q.hl || 'ar', cc_lang_pref: q.hl || 'ar', origin: location.origin },
      events: {
        onReady: function (e) { tell('ready'); try { e.target.playVideo(); } catch (x) {} },
        onStateChange: function (e) { if (e.data === 1) tell('playing'); if (e.data === 0) tell('ended'); },
        onError: function (e) { tell('error', e.data); }
      }
    });
  };
  var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = function () { tell('error', 'api'); };
  document.head.appendChild(s);
})();
</script>
</body></html>
